name: PR Build and Deploy Preview

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  ARTIFACT_REGISTRY_URL: ${{ vars.ARTIFACT_REGISTRY_URL }}
  CLOUD_SQL_CONNECTION_NAME: ${{ vars.CLOUD_SQL_CONNECTION_NAME }}
  DB_USER: ${{ vars.DB_USER }}
  DB_NAME: ${{ vars.DB_NAME }}
  GKE_CLUSTER_NAME: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_CLUSTER_LOCATION: ${{ vars.GKE_CLUSTER_LOCATION }}
  APP_RUNTIME_GCP_SA: ${{ vars.APP_RUNTIME_GCP_SA }}
  IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.sha }}
  DEPLOYMENT_NAME: moonpay-app-pr-${{ github.event.pull_request.number }}
  PR_NUMBER: ${{ github.event.pull_request.number }}
  USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run database migrations
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PRISMA_URL: postgresql://${{ vars.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/${{ vars.DB_NAME }}?schema=public
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy "${CLOUD_SQL_CONNECTION_NAME}" --port 5432 &
          PROXY_PID=$!
          trap "kill ${PROXY_PID}" EXIT
          sleep 3
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec prisma migrate deploy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ARTIFACT_REGISTRY_URL }}:${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${GKE_CLUSTER_NAME}" \
            --zone="${GKE_CLUSTER_LOCATION}" \
            --project="${GCP_PROJECT_ID}"

      - name: Deploy to GKE
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          kubectl create secret generic db-credentials \
            --namespace=moonpay \
            --from-literal=password="${DB_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install "${DEPLOYMENT_NAME}" ./helm/moonpay-app \
            --namespace moonpay \
            --create-namespace \
            --set image.repository="${ARTIFACT_REGISTRY_URL}" \
            --set image.tag="${IMAGE_TAG}" \
            --set cloudSql.connectionName="${CLOUD_SQL_CONNECTION_NAME}" \
            --set db.user="${DB_USER}" \
            --set db.name="${DB_NAME}" \
            --set serviceAccount.annotations."iam\.gke\.io/gcp-service-account"="${APP_RUNTIME_GCP_SA}" \
            --set pr.enabled=true \
            --set pr.number="${PR_NUMBER}" \
            --wait --timeout 120s

      - name: Post preview access instructions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="Preview deployed to GKE (ClusterIP). Access locally:

          \`\`\`bash
          gcloud container clusters get-credentials ${GKE_CLUSTER_NAME} --zone=${GKE_CLUSTER_LOCATION} --project=${GCP_PROJECT_ID}
          kubectl port-forward -n moonpay svc/${DEPLOYMENT_NAME} 3000:3000
          \`\`\`

          Then open http://localhost:3000"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "${BODY}"
