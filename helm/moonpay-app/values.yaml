# Overridden by PR deploy workflow to pr-<number>; production uses values-production.yaml
namespace: moonpay
nameOverride: moonpay-app

image:
  repository: ""
  tag: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

pr:
  enabled: true
  number: ""

cloudSql:
  connectionName: ""
  proxyImage: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3

db:
  user: ""
  name: ""
  existingSecret: db-credentials
  passwordKey: password

serviceAccount:
  create: true
  name: app
  annotations: {}

resources:
  app:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  cloudSqlProxy:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
